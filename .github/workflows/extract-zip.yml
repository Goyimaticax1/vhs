name: Extract project zip

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-zip.yml'
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-sync
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf project _tmp_extract
          mkdir -p _tmp_extract
          unzip -o VHS_Camcorder_Godot48_Nodes.zip -d _tmp_extract
          mkdir -p project
          cp -a _tmp_extract/VHS_Camcorder_Godot48_Nodes/. project/
          rm -rf _tmp_extract
          find project -type f | sort

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A project
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract VHS_Camcorder_Godot48_Nodes.zip into project/"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 7
          done
          exit 1
