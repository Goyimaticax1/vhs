name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'project/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: vhs-camcorder

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (for zipalign + apksigner)
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platform-tools'

      - name: Cache Godot ${{ env.GODOT_VERSION }}
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }} + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin
          curl -fL --retry 3 -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d /tmp/godot-extract
          mv "/tmp/godot-extract/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -o /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates
          rm -rf "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv /tmp/templates/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Godot version
        run: ~/godot-bin/godot --headless --version

      - name: Import project (build the resource cache)
        working-directory: project
        run: |
          # First import pass always reports "errors" on a cold cache; run twice.
          ~/godot-bin/godot --headless --import || true
          ~/godot-bin/godot --headless --import

      - name: Export unsigned APK
        working-directory: project
        run: |
          set -euo pipefail
          mkdir -p build
          ~/godot-bin/godot --headless --export-debug "Android" "build/${EXPORT_NAME}-unsigned.apk"
          ls -lh build

      - name: Align and sign APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Using $BUILD_TOOLS"
          keytool -genkeypair -v \
            -keystore /tmp/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            "project/build/${EXPORT_NAME}-unsigned.apk" \
            "project/build/${EXPORT_NAME}.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/debug.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            "project/build/${EXPORT_NAME}.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "project/build/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-apk
          path: project/build/${{ env.EXPORT_NAME }}.apk
          if-no-files-found: error
          retention-days: 30
