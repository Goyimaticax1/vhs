name: Repack project zip

on:
  push:
    branches: [main]
    paths:
      - 'project/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-sync
  cancel-in-progress: false

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild zip from project/
        run: |
          rm -rf _pack
          mkdir -p _pack/VHS_Camcorder_Godot48_Nodes
          cp -a project/. _pack/VHS_Camcorder_Godot48_Nodes/
          rm -rf _pack/VHS_Camcorder_Godot48_Nodes/.godot _pack/VHS_Camcorder_Godot48_Nodes/build
          rm -f VHS_Camcorder_Godot48_Nodes.zip
          (cd _pack && zip -X -r ../VHS_Camcorder_Godot48_Nodes.zip VHS_Camcorder_Godot48_Nodes)
          rm -rf _pack
          unzip -l VHS_Camcorder_Godot48_Nodes.zip

      - name: Commit zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f VHS_Camcorder_Godot48_Nodes.zip
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Repack VHS_Camcorder_Godot48_Nodes.zip from project/"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 7
          done
          exit 1
